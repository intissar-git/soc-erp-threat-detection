# =========================================================
# TheHive 5.2 - Configuration case management
# Base de données : Cassandra
# Index : Elasticsearch (secondaire, non-Wazuh)
# =========================================================

play.http.secret.key = "votre clef généré en utilisant :openssl_rand_base64_32"

# ---------------------------------------------------------
# Base de données Cassandra
# ---------------------------------------------------------
db {
  provider = janusgraph
  janusgraph {
    storage {
      backend = cql
      hostname = ["cassandra"]
      port = 9042
      username = "cassandra"
      password = "cassandra"
      cql {
        cluster-name = thp
        keyspace = thehive
      }
    }
    index {
      search {
        backend = elasticsearch
        hostname = ["elasticsearch"]
        port = 9200
        index-name = thehive
      }
    }
  }
}

# ---------------------------------------------------------
# Interface d'administration
# ---------------------------------------------------------
application.baseUrl = "http://thehive:9000"

# ---------------------------------------------------------
# Cortex (enrichissement des observables)
# ---------------------------------------------------------
cortex {
  servers = [
    {
      name = "cortex-local"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "your API_KEY"
      }
    }
  ]
}

# ---------------------------------------------------------
# Authentification locale
# ---------------------------------------------------------
auth {
  provider = [local]
  ad {
    # Non utilisé - authentification locale uniquement
    enabled = false
  }
}

# ---------------------------------------------------------
# Notifications email (optionnel)
# ---------------------------------------------------------
notifier {
  email {
    from = "thehive-noreply@example.local"
    smtp {
      host = "smtp.gmail.com"
      port = 587
      user = "soc-notifications@example.local"
      password = "your password"
      auth = true
      starttls = true
    }
  }
}

# ---------------------------------------------------------
# Limites de ressources (adapté à la VM 16 Go)
# ---------------------------------------------------------
play.modules.enabled += "org.thp.thehive.connector.cortex.CortexModule"
play.http.parser.maxMemoryBuffer = 20MB
play.http.parser.maxDiskBuffer = 100MB

# ---------------------------------------------------------
# Logs
# ---------------------------------------------------------
logger.root = ERROR
logger.org.thp = INFO