# =========================================================
# Logstash - Pipeline de collecte pour la stack ELK secondaire
# Rôle : ingérer les logs non-Wazuh (ex: logs système, logs Azure NSG)
#        et les envoyer vers Elasticsearch pour rétention forensic.
# =========================================================

input {
  # Logs système envoyés par rsyslog depuis les VMs cibles
  syslog {
    port  => 5140
    type  => "syslog"
  }

  # Logs Azure NSG Flow (via Event Hub ou stockage Blob - pull périodique)
  # Note : dans le POC, ces logs sont récupérés via le module azure-logs
  #        du manager Wazuh. Ce pipeline sert de fallback / rétention longue.
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # ---------------------------------------------------------
  # Parsing des logs syslog
  # ---------------------------------------------------------
  if [type] == "syslog" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:hostname} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}"
      }
    }
    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # ---------------------------------------------------------
  # Détection des tentatives d'authentification échouées
  # ---------------------------------------------------------
  if [message] =~ /Failed password|authentication failure/ {
    mutate {
      add_tag => ["auth_failure"]
      add_field => { "security_severity" => "medium" }
    }
  }

  # ---------------------------------------------------------
  # Détection des erreurs web (scans, path traversal)
  # ---------------------------------------------------------
  if [message] =~ /\.\.\/|%2e%2e/ {
    mutate {
      add_tag => ["path_traversal_attempt"]
      add_field => { "security_severity" => "high" }
    }
  }
}

output {
  # ---------------------------------------------------------
  # Indexation dans Elasticsearch (instance secondaire)
  # ---------------------------------------------------------
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "soc-forensic-%{+YYYY.MM.dd}"
    manage_template => false
  }

  # Debug en développement (à commenter en production)
  # stdout { codec => rubydebug }
}