# =========================================================
# Cortex 3.1.8 - Configuration analyzers / responders
# Utilisé par TheHive pour enrichir les observables
# =========================================================

play.http.secret.key = "votre clef généré en utilisant :openssl_rand_base64_32"

# ---------------------------------------------------------
# Base de données Elasticsearch (partagée avec TheHive)
# ---------------------------------------------------------
search {
  index = cortex
  uri = "http://elasticsearch:9200"
}

# ---------------------------------------------------------
# Interface
# ---------------------------------------------------------
application.baseUrl = "http://cortex:9001"

# ---------------------------------------------------------
# Authentification locale (pas de SSO en POC)
# ---------------------------------------------------------
auth {
  provider = [local]
}

# ---------------------------------------------------------
# Clés API par défaut (seront remplacées via l'UI)
# ---------------------------------------------------------
# À configurer manuellement via l'interface Cortex après le premier démarrage :
#   - VirusTotal API key
#   - MISP API key + URL
#   - AbuseIPDB (optionnel)
#   - Shodan (optionnel)
# Ces secrets ne doivent JAMAIS être commités dans Git.

# ---------------------------------------------------------
# Jobs / analyzers
# ---------------------------------------------------------
job {
  runner = "docker"
  docker {
    host = "unix:///var/run/docker.sock"
  }
  # Les analyzers sont téléchargés depuis le catalogue officiel
  directory = "/opt/cortex/analyzers"
}

# ---------------------------------------------------------
# Limites de ressources
# ---------------------------------------------------------
play.http.parser.maxMemoryBuffer = 20MB
play.http.parser.maxDiskBuffer = 100MB

# ---------------------------------------------------------
# Logs
# ---------------------------------------------------------
logger.root = ERROR
logger.io.thehive = INFO